services:
  doxie:
    build:
      context: .
      dockerfile: Dockerfile
    image: doxieos:1.2-alpha
    container_name: doxieos
    ports:
      - "${DOXIE_HTTP_PORT:-6034}:5034"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:5034
      HOME: /data/home
      XDG_CONFIG_HOME: /data/home/.config
      Storage__SkillsDirectory: /workspace/.doxie/skills
      Storage__AgentsDirectory: /workspace/.doxie/agents
      Storage__WorkflowsDirectory: /workspace/.doxie/workflows
      Storage__LibrariesDirectory: /workspace/.doxie/libraries
      Storage__DatabasePath: /data/state/state.db
      Storage__WorkspacesDirectory: /data/workspaces
      Storage__WorkflowRunsDirectory: /data/runs
      Storage__SandboxesDirectory: /data/sandboxes
    volumes:
      - ./.doxie:/workspace/.doxie
      - ./.private:/workspace/.private
      - doxie_home:/data/home
      - doxie_state:/data/state
      - doxie_workspaces:/data/workspaces
      - doxie_runs:/data/runs
      - doxie_sandboxes:/data/sandboxes
    networks:
      - doxie
    restart: unless-stopped

volumes:
  doxie_home:
  doxie_state:
  doxie_workspaces:
  doxie_runs:
  doxie_sandboxes:

networks:
  doxie:
    name: ${DOXIE_DOCKER_NETWORK:-doxie}
