name: Electron CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check dependency sources and integrity
        run: node tools/check-dependencies.mjs

      - name: Install the locked dependencies with lifecycle scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify npm registry signatures and available attestations
        run: npm audit signatures

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=high

      - name: Prepare the verified Electron runtime and terminal binding
        run: |
          npm rebuild electron node-pty --ignore-scripts=false
          node node_modules/electron/install.js

      - name: Run Node tests
        run: npm test

      - name: Build the React renderer
        run: npm run build

      - name: Run Electron smoke tests on Windows
        if: runner.os == 'Windows'
        run: npm run test:desktop

      - name: Run Electron smoke tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

      - name: Package the Windows desktop app
        if: runner.os == 'Windows'
        run: npm run package

      - name: Smoke-test the packaged Windows app
        if: runner.os == 'Windows'
        env:
          DOXIE_TEST_EXECUTABLE: ${{ github.workspace }}\release\DoxieOS-win32-x64\DoxieOS.exe
        run: npm run test:desktop

      - name: Upload the portable Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DoxieOS-win32-x64
          path: release/DoxieOS-win32-x64.zip
          if-no-files-found: error
          compression-level: 0
